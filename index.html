<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#0c111a" />
  <meta name="format-detection" content="telephone=no" />
  <title>锁号台 · 竞彩 / 北单 / 任9 / 任14</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=32" />
</head>
<body>
  <div class="chrome">
    <header class="topbar">
      <div class="brand">
        <span class="logo">盘</span>
        <div>
          <h1>锁号台</h1>
          <p>灯是状态，动作才是出不出手 · 结论写明从哪来</p>
        </div>
      </div>
      <div class="top-stats" id="topStats"></div>
      <div class="refresh-clock" id="refreshClock">
        <div class="stat">
          <b id="refreshCount">60:00</b>
          <span id="refreshHint">每小时按竞彩即时盘重算，开赛场次保留并刷实时比分</span>
        </div>
        <button type="button" class="ghost" id="btnRefresh">立即刷新</button>
      </div>
      <div class="top-actions">
        <button type="button" class="ghost" id="btnCopy">复制锁号</button>
        <button type="button" class="ghost" id="btnAdd">+ 录入</button>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button type="button" class="tab on" data-view="jczq">竞彩</button>
      <button type="button" class="tab" data-view="beidan">北单</button>
      <button type="button" class="tab" data-view="r9">任 9</button>
      <button type="button" class="tab" data-view="r14">任 14</button>
      <button type="button" class="tab" data-view="news">内部消息</button>
      <button type="button" class="tab" data-view="results">赛果</button>
      <button type="button" class="tab" data-view="review">昨夜复盘</button>
      <button type="button" class="tab" data-view="rules">怎么看</button>
    </nav>
  </div>

  <main class="workspace" id="workspace"></main>

  <div class="modal" id="modal" hidden aria-hidden="true">
    <div class="modal-card">
      <header>
        <h2>手动录入赛事</h2>
        <button type="button" class="icon" id="btnCloseModal">×</button>
      </header>
      <form id="addForm">
        <div class="grid2">
          <label>场次<input name="code" placeholder="周三014" required /></label>
          <label>联赛<input name="league" placeholder="英超" required /></label>
          <label>主队<input name="home" required /></label>
          <label>客队<input name="away" required /></label>
          <label>时间<input name="kickoff" placeholder="03:00" /></label>
          <label>SP<input name="sp" placeholder="1.89 / 3.55 / 3.14" /></label>
        </div>
        <label>方向
          <select name="pick">
            <option>主</option>
            <option>平</option>
            <option>客</option>
            <option>主/平</option>
            <option>主/客</option>
            <option>平/客</option>
            <option>让胜</option>
            <option>让平</option>
            <option>让负</option>
            <option>让胜/让平</option>
            <option>让胜/让负</option>
            <option>让平/让负</option>
          </select>
        </label>
        <div class="grid2">
          <label>全场比分 1<input name="ft1" placeholder="1-0" /></label>
          <label>全场比分 2<input name="ft2" placeholder="2-1" /></label>
          <label>半场比分 1<input name="ht1" placeholder="0-0" /></label>
          <label>半场比分 2<input name="ht2" placeholder="1-0" /></label>
          <label>全场大小 1<input name="ou1" placeholder="小2.5" /></label>
          <label>全场大小 2<input name="ou2" placeholder="小3.5" /></label>
          <label>半场大小 1<input name="htou1" placeholder="小1.5" /></label>
          <label>半场大小 2<input name="htou2" placeholder="小0.5" /></label>
        </div>
        <label>临场伤停 / 发布会（盘口可能还没吃进去的）
          <input name="unpriced" placeholder="没有就空着" />
        </label>
        <label>这场怎么看
          <select name="light">
            <option value="yellow">胶着 · 买两边</option>
            <option value="green">清楚 · 跟一边</option>
            <option value="red">别碰 · 热门单边不可信</option>
          </select>
        </label>
        <footer>
          <button type="submit" class="primary">写入</button>
        </footer>
      </form>
    </div>
  </div>

  <script src="js/data.js?v=32"></script>
  <script src="js/odds.js?v=32"></script>
  <script src="js/extras.js?v=32"></script>
  <script src="js/engine.js?v=32"></script>
  <script src="js/live.js?v=32"></script>
  <script src="js/jc-cache.js?v=32"></script>
  <script src="js/ouzhi-cache.js?v=32"></script>
  <script src="js/bjdc-cache.js?v=32"></script>
  <script src="js/sfc-cache.js?v=32"></script>
  <script src="js/form-cache.js?v=32"></script>
  <script src="js/news-cache.js?v=32"></script>
  <script src="js/result-cache.js?v=32"></script>
  <script src="js/books.js?v=32"></script>
  <script src="js/form.js?v=32"></script>
  <script src="js/news.js?v=32"></script>
  <script src="js/results.js?v=32"></script>
  <script src="js/predictor.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
  <p class="site-foot">版 10-21v · 开赛场次保留并刷实时比分。仅作盘口研究。</p>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=32");
    }
  </script>
</body>
</html>
